name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Clang frontend
        run: clang++ --version
      - name: Verify recovered paper corpus integrity
        run: |
          python -m py_compile scripts/pin-paper-corpus.py
          python scripts/pin-paper-corpus.py --validate-selection-only
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Validate build-neutral Java boundary
        run: |
          bash scripts/test-java-compilation-contexts-local.sh
          bash scripts/test-java-dependency-resolvers-local.sh .
          bash scripts/test-java-corpus-fallback-local.sh .
          bash scripts/audit-no-special-cases.sh
          bash scripts/audit-java-architecture-boundary.sh
